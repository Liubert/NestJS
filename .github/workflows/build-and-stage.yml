name: Build And Stage Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build And Push Immutable Artifact
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      image_digest: ${{ steps.build.outputs.digest }}
      admin_ui_image_ref: ${{ steps.meta.outputs.admin_ui_image_ref }}
      admin_ui_digest: ${{ steps.build-admin-ui.outputs.digest }}
      commit_sha: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        run: |
          IMAGE_REPO="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          IMAGE_TAG="sha-${GITHUB_SHA}"
          IMAGE_REF="${IMAGE_REPO}:${IMAGE_TAG}"
          ADMIN_UI_IMAGE_REF="${IMAGE_REPO}-admin-ui:${IMAGE_TAG}"
          {
            echo "image_repo=${IMAGE_REPO}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image_ref=${IMAGE_REF}"
            echo "admin_ui_image_ref=${ADMIN_UI_IMAGE_REF}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.image_ref }}
          provenance: false
          sbom: false

      - name: Build and push admin-ui image
        id: build-admin-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          target: admin-ui
          push: true
          tags: ${{ steps.meta.outputs.admin_ui_image_ref }}
          provenance: false
          sbom: false

      - name: Create release manifest
        run: |
          cat > release-manifest.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "services": {
              "api": {
                "image": "${{ steps.meta.outputs.image_ref }}",
                "digest": "${{ steps.build.outputs.digest }}"
              },
              "admin-ui": {
                "image": "${{ steps.meta.outputs.admin_ui_image_ref }}",
                "digest": "${{ steps.build-admin-ui.outputs.digest }}"
              }
            }
          }
          EOF
          cat release-manifest.json

      - name: Upload release manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          retention-days: 14

  deploy-stage:
    name: Deploy To Stage
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: stage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log deployment metadata
        run: |
          echo "commit=${{ needs.build.outputs.commit_sha }}"
          echo "image=${{ needs.build.outputs.image_ref }}"
          echo "digest=${{ needs.build.outputs.image_digest }}"
          echo "target=stage"

      - name: Copy compose.yml to stage
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGE_SSH_HOST }}
          username: ${{ secrets.STAGE_SSH_USER }}
          key: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGE_SSH_PORT || '22' }}
          source: compose.yml
          target: ${{ secrets.STAGE_DEPLOY_PATH }}

      - name: Deploy on stage VM through SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          ADMIN_UI_IMAGE_REF: ${{ needs.build.outputs.admin_ui_image_ref }}
          DEPLOY_PATH: ${{ secrets.STAGE_DEPLOY_PATH }}
          STAGE_HEALTHCHECK_URL: ${{ secrets.STAGE_HEALTHCHECK_URL }}
          COMPOSE_FILE: ${{ secrets.STAGE_COMPOSE_FILE }}
          SERVICES: ${{ secrets.STAGE_SERVICES }}
          GEMINI_API_KEY: ${{ secrets.STAGE_GEMINI_API_KEY }}
          STAGE_ADMIN_UI_URL: ${{ secrets.STAGE_ADMIN_UI_URL }}
        with:
          host: ${{ secrets.STAGE_SSH_HOST }}
          username: ${{ secrets.STAGE_SSH_USER }}
          key: ${{ secrets.STAGE_SSH_PRIVATE_KEY }}
          port: ${{ secrets.STAGE_SSH_PORT || '22' }}
          envs: IMAGE_REF,ADMIN_UI_IMAGE_REF,DEPLOY_PATH,STAGE_HEALTHCHECK_URL,COMPOSE_FILE,SERVICES,GEMINI_API_KEY,STAGE_ADMIN_UI_URL
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH}"
            COMPOSE_FILE="${COMPOSE_FILE:-compose.yml}"
            SERVICES="${SERVICES:-api admin-ui}"
            STAGE_HEALTHCHECK_URL="${STAGE_HEALTHCHECK_URL:-http://localhost:8080/health}"

            printf 'APP_IMAGE=%s\nADMIN_UI_IMAGE=%s\nGEMINI_API_KEY=%s\n' \
              "${IMAGE_REF}" "${ADMIN_UI_IMAGE_REF}" "${GEMINI_API_KEY}" > .env.cicd

            echo "[1/4] Pulling images: ${SERVICES} migrate"
            docker compose -f "${COMPOSE_FILE}" --env-file .env --env-file .env.cicd --profile tools pull ${SERVICES} migrate
            echo "[1/4] Pull done"

            echo "[2/4] Running database migrations..."
            docker compose -f "${COMPOSE_FILE}" --env-file .env --env-file .env.cicd --profile tools run --rm migrate
            echo "[2/4] Migrations done"

            echo "[3/4] Starting services: ${SERVICES}"
            docker compose -f "${COMPOSE_FILE}" --env-file .env --env-file .env.cicd up -d --no-build ${SERVICES}
            echo "[3/4] Services started"

            # --- Helper: dump diagnostics for all services ---
            dump_diagnostics() {
              echo "--- docker compose ps ---"
              docker compose -f "${COMPOSE_FILE}" --env-file .env --env-file .env.cicd ps
              for svc in api admin-ui postgres; do
                echo "--- ${svc} logs (last 30 lines) ---"
                docker compose -f "${COMPOSE_FILE}" --env-file .env --env-file .env.cicd logs --tail=30 "${svc}" || true
              done
            }

            echo "[4/5] Waiting for API health at ${STAGE_HEALTHCHECK_URL} (max 3 min)..."
            API_HEALTHY=false
            for i in $(seq 1 36); do
              STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${STAGE_HEALTHCHECK_URL}" 2>/dev/null || echo "000")
              echo "  attempt ${i}/36 — HTTP ${STATUS}"
              if [ "${STATUS}" = "200" ]; then
                echo "[4/5] API health passed"
                API_HEALTHY=true
                break
              fi
              sleep 5
            done

            if [ "${API_HEALTHY}" = "false" ]; then
              echo "[4/5] API health check failed after 3 min"
              dump_diagnostics
              exit 1
            fi

            echo "[5/5] Checking admin-ui..."
            ADMIN_UI_URL="${STAGE_ADMIN_UI_URL:-http://localhost:3010}"
            ADMIN_STATUS=$(curl -o /dev/null -s -w "%{http_code}" "${ADMIN_UI_URL}" 2>/dev/null || echo "000")
            echo "  admin-ui HTTP ${ADMIN_STATUS}"
            if [ "${ADMIN_STATUS}" = "200" ]; then
              echo "[5/5] Admin-UI check passed"
            else
              echo "[5/5] Admin-UI check failed — HTTP ${ADMIN_STATUS}"
              dump_diagnostics
              exit 1
            fi
