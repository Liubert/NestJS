name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality-checks:
    name: Lint, Tests, and Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test -- --runInBand --passWithNoTests

      - name: "Quality gate: Docker build validation (API)"
        run: docker build --target prod --tag local/nest-js:pr-${{ github.sha }} .

      - name: "Quality gate: Docker build validation (admin-ui)"
        run: docker build --target admin-ui --tag local/nest-js-admin-ui:pr-${{ github.sha }} .
