# TLS-enabled nginx configuration for TMS production deployment
# This is the TARGET state — currently running HTTP-only on stage

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name tms.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tms.example.com;

    # TLS certificates (Let's Encrypt / Cloudflare Origin)
    ssl_certificate     /etc/ssl/certs/tls.crt;
    ssl_certificate_key /etc/ssl/private/tls.key;

    # Modern TLS only — no SSLv3, TLS 1.0, TLS 1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS — tell browsers to always use HTTPS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Admin UI — static React build
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # API proxy — forward to NestJS on internal Docker network
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public translations — same NestJS backend
    location /translations/ {
        proxy_pass http://api:3000/translations/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
