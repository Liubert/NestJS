services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 10s
      retries: 20

  api:
    image: ${APP_IMAGE}
    build:
      context: .
      target: prod
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_NAME: ${APP_NAME}
      APP_PORT: ${APP_PORT}

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

      JWT_SECRET: ${JWT_SECRET}

      AWS_REGION: ${AWS_REGION}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      QUALITY_WORKER_DISABLED: "true"
    networks:
      - internal
      - public
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "8080:3000"

  quality-worker:
    image: ${APP_IMAGE}
    build:
      context: .
      target: prod
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      QUALITY_WORKER_STANDALONE: "true"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    command: ["node", "dist/quality-worker.main.js"]
    networks:
      - internal
    restart: unless-stopped

  admin-ui:
    image: ${ADMIN_UI_IMAGE}
    build:
      context: .
      target: admin-ui
    depends_on:
      - api
    networks:
      - internal
      - public
    ports:
      - "${ADMIN_UI_PORT:-3001}:80"
    restart: unless-stopped

  migrate:
    image: ${APP_IMAGE}
    profiles: ["tools"]
    build:
      context: .
      target: prod
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    networks:
      - internal
    command: ["npm", "run", "migration:run:prod"]

  seed:
    image: ${APP_IMAGE}
    profiles: ["seed"]
    build:
      context: .
      target: prod
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    networks:
      - internal
    command: ["npm", "run", "seed:prod"]

volumes:
  pgdata:

networks:
  internal:
    internal: true
  public: {}
