services:
  # Disable one-off migration container in regular `make dev` up flow.
  # Run it manually via `make migrate` when needed.
  migrate:
    profiles: ["dev-tools"]

  api:
    image: ${APP_IMAGE:-locale-engine:local}-dev
    env_file:
      - .env
    build:
      context: .
      target: dev
    command: npm run start:dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      APP_NAME: ${APP_NAME}
      APP_PORT: ${APP_PORT}

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}

      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "8080:3000"
    networks:
      - internal
      - public

  # Dev-only seed (ts-node)
  seed:
    env_file:
      - .env
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
    networks:
      - internal
    command: ["npm", "run", "seed"]
    profiles: ["dev-tools"]

  quality-worker:
    image: ${APP_IMAGE:-locale-engine:local}-dev
    env_file:
      - .env
    build:
      context: .
      target: dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WORKER_CMD: "npx ts-node src/quality-worker.main.ts"
    volumes:
      - ./:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - internal
      - public

  admin-ui:
    profiles: ["disabled"]

networks:
  internal:
    internal: true
  public: {}
